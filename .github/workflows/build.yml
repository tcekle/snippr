name: build

# CI sanity build on Windows. Uploads two artifacts:
#   - snippr-<ver>-setup   the NSIS per-user installer (-setup.exe)
#   - snippr-<ver>-exe     the standalone snippr.exe (also the CLI/MCP binary)
# This does NOT produce signed updater artifacts, so it needs no signing secrets;
# release.yml handles signed releases + the update manifest.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: # docs-only changes don't need a full installer build
      - '**/*.md'
      - 'docs/**'
# Release tags are handled by release.yml, not here, to avoid a double build.

# The pinned actions still ship a Node 20 runtime (deprecated). Opt them onto
# Node 24 now — GitHub's documented forward-compat switch until their majors bump.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so git-describe versioning works

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      # MinVer-style: derive the version from the latest vX.Y.Z tag + commit
      # height and stamp it into package.json / tauri.conf.json / Cargo.toml.
      # Stamped only here (not committed); exposes version/full/sha as outputs.
      - name: Compute & stamp version
        id: version
        run: node scripts/compute-version.mjs --write

      # NSIS per-user installer + the release exe. `tauri build` (not
      # `cargo build --release`) embeds the frontend so the exe serves
      # tauri.localhost — required for the CLI/MCP render path to work.
      - name: Build (installer + exe)
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: snippr-${{ steps.version.outputs.version }}-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: snippr-${{ steps.version.outputs.version }}-exe
          path: src-tauri/target/release/snippr.exe
          if-no-files-found: error
