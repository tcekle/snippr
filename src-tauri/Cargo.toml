[package]
name = "snippr"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "snippr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# MP4→GIF transcode (gif_export). Both are already in the tree via `image`;
# pinning the same majors reuses the locked builds (no duplicate compilation).
gif = "0.14"
color_quant = "1.1"
# CRC-32 for the editable-PNG scene chunk splice (png_embed). Already in
# Cargo.lock transitively (flate2/png), so this reuses the locked build.
crc32fast = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
# CLI front-end (`snippr generate|describe`). clap = the System.CommandLine-style
# declarative parser; clap_complete emits shell-completion scripts.
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # AttachConsole: a windows-subsystem binary has no console, so CLI output
    # (describe/help/errors) is wired to the parent terminal in CLI mode.
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    # Media Foundation H.264 SinkWriter (screen recording).
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
] }

